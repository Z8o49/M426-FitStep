name: FitStep checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx expo export --platform all
        env:
          CI: 1
      - uses: actions/upload-artifact@v4
        with:
          name: fitstep-export
          path: dist
